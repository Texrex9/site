<!DOCTYPE html>
<!-- 
    ARQUIVO: precoDesconto.html
    DESCRIÇÃO: Interface web para cálculo de desconto em preços de produtos
    FUNCIONALIDADE: Permite ao usuário informar um preço base e percentual de desconto,
    exibindo o valor do desconto e o preço final em tempo real
-->
<html lang="pt-br">
<head>
    <!-- Configuração de codificação de caracteres (UTF-8 suporta acentuação) -->
    <meta charset="UTF-8">
    
    <!-- Meta tag de viewport para responsividade em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título da página exibido na aba do navegador -->
    <title>Calculadora de Desconto</title>
    
    <!-- Importação da folha de estilos CSS para estilizar a página -->
    <link rel="stylesheet" href="precoDesconto.css">
    
    <!-- Importação do arquivo JavaScript com as funções de cálculo -->
    <script src="precoDesconto_new.js"></script>
</head>
<body>
    <!-- CONTAINER PRINCIPAL: Div que centraliza e organiza o layout -->
    <div class="container">
        <!-- TÍTULO PRINCIPAL DA APLICAÇÃO -->
        <h1>Calculadora de Desconto</h1>
        
        <!-- CAMPO 1: ENTRADA DO PREÇO ORIGINAL -->
        <!-- Label: Tótulo do campo associado ao input -->
        <label for="preco">Digite o preço do produto:</label>
        
        <!-- Input type="number": Aceita apenas valores numéricos -->
        <!-- step="0.01": Permite incrementos de até 0.01 (centavos) -->
        <!-- placeholder: Texto sugestivo de exemplo dentro do campo -->
        <!-- id="preco": Identifica o elemento para ser acessado no JavaScript -->
        <input type="number" id="preco" step="0.01" placeholder="Ex: 199.90">
        
        <!-- <br><br>: Cria salões entre os campos (quebra de linha dupla) -->
        <br><br>
        
        <!-- CAMPO 2: ENTRADA DA PORCENTAGEM DE DESCONTO -->
        <!-- Label: Tótulo do campo associado ao input -->
        <label for="porcentagemDesconto">Porcentagem de desconto (%):</label>
        
        <!-- Input type="number": Aceita apenas valores numéricos -->
        <!-- step="0.01": Permite incrementos de até 0.01 para desconto decimal -->
        <!-- placeholder: Texto sugestivo de exemplo dentro do campo -->
        <!-- id="porcentagemDesconto": Identifica o elemento para ser acessado no JavaScript -->
        <input type="number" id="porcentagemDesconto" step="0.01" placeholder="Ex: 15">
        
        <!-- <br><br>: Cria salões entre o campo e o botão -->
        <br><br>
        
        <!-- BOTÃO DE AÇÃO -->
        <!-- onclick="calcularDesconto()": Executa a função JavaScript "calcularDesconto()" quando clicado -->
        <!-- Esta função estará definida no arquivo precoDesconto.js -->
        <button onclick="calcularDesconto()">Calcular Desconto</button>
        
        <!-- PARÁGRAFO DE EXIBIÇÃO DO RESULTADO -->
        <!-- Inicialmente vazio, será preenchido com o resultado do cálculo -->
        <!-- id="resultado": Identifica o elemento para ser manipulado no JavaScript -->
        <!-- Aqui será exibido: valor do desconto, preço final e outras informações -->
        <p id="resultado"></p>
    </div>
</body>
</html>
