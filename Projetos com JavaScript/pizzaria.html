<!DOCTYPE html>
<!-- 
    ARQUIVO: pizzaria.html
    DESCRIÇÃO: Interface web para sistema de pedido de pizzas
    FUNCIONALIDADE: Permite ao usuário selecionar sabor, tamanho e ingredientes extras,
    visualizar o pedido na página e em alertas, além de fazer novos pedidos
-->
<html lang="pt-br">
<head>
    <!-- Configuração de codificação de caracteres (UTF-8 suporta acentuação) -->
    <meta charset="UTF-8">
    
    <!-- Meta tag de viewport para responsividade em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Importação da folha de estilos CSS -->
    <link rel="stylesheet" href="pizzaria.css">
    
    <!-- Título da página exibido na aba do navegador -->
    <title>Pizzaria</title>
</head>
<body>
    <!-- CABEÇALHO DA PÁGINA -->
    <header>
        <!-- Título principal do site -->
        <h1>Bem-vindo à Pizzaria Delícia!</h1>
    </header>
    
    <!-- SEÇÃO PRINCIPAL: FORMULÁRIO DE PEDIDOS -->
    <section id="cardapio">
        <!-- CAMPO 1: SELEÇÃO DE SABOR -->
        <!-- Este select permite escolher um sabor de pizza -->
        <!-- ID "sabor" é usado para capturar o valor no JavaScript -->
        <h2>Escolha uma pizza</h2>
        <select name="pizza" id="sabor">
            <!-- Opção padrão vazia (obrigatória para validação) -->
            <option value="">Selecione um sabor</option>
            <option value="mussarela">Mussarela</option>
            <option value="calabresa">Calabresa</option>
            <option value="portuguesa">Portuguesa</option>
            <option value="frango">Frango com Catupiry</option>
        </select>

        <!-- CAMPO 2: SELEÇÃO DE TAMANHO -->
        <!-- Este select permite escolher o tamanho da pizza -->
        <!-- ID "tamanho" é usado para capturar o valor no JavaScript -->
        <h2>Escolha o tamanho</h2>
        <select name="tamanho" id="tamanho">
            <!-- Opção padrão vazia (obrigatória para validação) -->
            <option value="">Selecione um tamanho</option>
            <option value="pequena">Pequena (6 fatias)</option>
            <option value="media">Média (8 fatias)</option>
            <option value="grande">Grande (12 fatias)</option>
        </select>

        <!-- CAMPO 3: SELEÇÃO DE INGREDIENTES EXTRAS -->
        <!-- Este é um select múltiplo (permite selecionar vários itens) -->
        <!-- Atributo "multiple" permite seleção de mais de uma opção -->
        <h2>Adicione ingredientes extras</h2>
        <select name="ingredientes" id="ingredientes" multiple>
            <!-- Opções de ingredientes extras (não obrigatórios) -->
            <option value="bacon">Bacon</option>
            <option value="cebola">Cebola</option>
            <option value="pimentao">Pimentão</option>
            <option value="azeitona">Azeitona</option>
        </select>

        <!-- BOTÕES DE AÇÃO -->
        <!-- Botão 1: Faz o pedido e valida se sabor e tamanho foram selecionados -->
        <button onclick="fazerPedido()">Fazer Pedido</button>
        
        <!-- Botão 2: Exibe o pedido atualmente armazenado em um alert -->
        <button onclick="mostrarPedido()">Mostrar Pedido</button>
        
        <!-- Botão 3: Limpa todos os campos do formulário e o pedido exibido -->
        <button onclick="novoPedido()">Novo Pedido</button>
        
        <!-- PARÁGRAFO DE EXIBIÇÃO DO PEDIDO -->
        <!-- Aqui será exibido o pedido confirmado na página -->
        <!-- ID "pedido" é usado para manipular o conteúdo via JavaScript -->
        <p id="pedido"></p>
        
        <!-- IMPORTAÇÃO DO ARQUIVO JAVASCRIPT -->
        <!-- Contém as funções: fazerPedido(), mostrarPedido() e novoPedido() -->
        <script src="pizzaria.js"></script>
    </section>
</body>
</html>
