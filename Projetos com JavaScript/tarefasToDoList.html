<!DOCTYPE html>
<!-- 
    ARQUIVO: tarefasToDoList.html
    DESCRIÇÃO: Aplicativo de lista de tarefas (To-Do List)
    OBJETIVO: Permitir ao usuário adicionar, visualizar e gerenciar tarefas
    FUNCIONALIDADE: Entrada de texto + botão + lista dinâmica
-->
<html lang="pt-br">
<head>
    <!-- CONFIGURAÇÕES DA PÁGINA -->
    
    <!-- Define a codificação de caracteres como UTF-8 -->
    <meta charset="UTF-8">
    
    <!-- Configura a página para responsividade em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Titulo da página -->
    <title>Minha Lista de Tarefas</title>
    
    <!-- LINK PARA ARQUIVO CSS EXTERNO -->
    <!-- Importa os estilos de tarefasToDoList.css -->
    <link rel="stylesheet" href="tarefasToDoList.css">
</head>
<body>
    <!-- CONTAINER PRINCIPAL -->
    <div class="container">
        <!-- TÍTULO PRINCIPAL -->
        <!-- H1: Título da aplicação -->
        <h1>Minhas Tarefas</h1>
        
        <!-- SEÇÃO DE ENTRADA -->
        <!-- Div com classe 'entrada-tarefa' organiza input + botão lado a lado -->
        <div class="entrada-tarefa">
            <!-- 
                CAMPO DE ENTRADA (INPUT)
                - type="text": Permite digitação de texto
                - id="campotarefa": Identifica o elemento para o JavaScript
                - placeholder="...": Texto sugestivo dentro do input
            -->
            <input 
                type="text" 
                id="campotarefa" 
                placeholder="Digite uma nova tarefa..."
            >
            
            <!-- 
                BOTÃO ADICIONAR
                - id="botaoAdicionar": Identifica o botão para o JavaScript
                - onclick="adicionarTarefa()": Chama a função ao clicar
            -->
            <button id="botaoAdicionar" onclick="adicionarTarefa()">Adicionar</button>
        </div>
        
        <!-- LISTA DE TAREFAS -->
        <!-- 
            Tag <ul>: Lista não-ordenada
            - id="listaTarefas": Identifica a lista para o JavaScript
            - Os <li> (itens) serão adicionados aqui dinamicamente
        -->
        <ul id="listaTarefas">
            <!-- Os <li> serão inseridos aqui via JavaScript -->
        </ul>
    </div>
    
    <!-- SCRIPT JAVASCRIPT EXTERNO -->
    <!-- Importa as funções e eventos de tarefasToDoList.js -->
    <script src="tarefasToDoList.js"></script>
</body>
</html>
