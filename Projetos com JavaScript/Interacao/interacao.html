<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="interacao.css" />    
    <title>Interação</title>    
    <style>
      button {
        margin: 20px;
        padding: 10px 20px;
        cursor: pointer;
      }
      input {
        margin-top: 20px;
        padding: 20px;
        font-size: 16px;
      }
    </style>
  </head>

    <h1>Escolha a cor de fundo ou intejara de outras formas</h1>

    <button id="greenButton">Verde</button>
    <button id="blueButton">Azul</button>
    <input
      type="text"
      id="inputBox"
      placeholder="Pressionar uma tecla"
      size="20"
    />
    <script src="interacao.js"></script>
  </body>
